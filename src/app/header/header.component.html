<header class="py-5">
  <div class="site-container flex w-full items-center justify-between">
    <a routerLink="/"
       class="mr-24 text-2xl focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-selected-text">
      Amadeusz Lewandowski
    </a>

    <!-- medium screen menu -->
    <nav class="hidden items-center gap-12 md:flex" [attr.aria-label]="'MAIN_NAVIGATION' | translate">
      <ul class="flex items-center gap-12">
        @for (item of navItems; track item.section) {
          <li>
            <a [href]="'/#' + item.section"
               [attr.aria-current]="activeSection() === item.section ? 'location' : null"
               class="inline-flex min-h-11 items-center transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-selected-text"
               [class]="desktopLinkClass(item.section)"
               (click)="navigateTo($event, item.section)">
              {{ item.label | translate }}
            </a>
          </li>
        }
      </ul>
      <app-language-selector></app-language-selector>
    </nav>

    <!-- small screen menu -->
    <div class="relative md:hidden">
      <div class="relative flex w-fit items-center justify-between py-2">
        <app-language-selector [mobile]="true"
                               [hideExpanded]="menuOpen()"
                               (languageExpanded)="closeMenu()"
        ></app-language-selector>
        <button type="button"
                class="flex h-11 w-11 touch-manipulation items-center justify-center rounded-md focus-visible:outline focus-visible:outline-2 focus-visible:outline-selected-text"
                [attr.aria-label]="(menuOpen() ? 'CLOSE_MENU' : 'OPEN_MENU') | translate"
                [attr.aria-expanded]="menuOpen()"
                [attr.aria-controls]="mobileMenuId"
                (click)="toggleMenu($event)">
          <img src="./assets/hamburger-menu.svg" alt="" class="h-8 w-10" />
        </button>
      </div>
      @if (menuOpen()) {
        <nav [id]="mobileMenuId"
             class="absolute right-0 top-full z-50 mt-1 min-w-[12rem] max-w-[calc(100vw-2rem)] rounded-md border border-neutral-400 bg-body px-1 shadow-lg"
             [attr.aria-label]="'MAIN_NAVIGATION' | translate">
          <ul>
            @for (item of navItems; track item.section) {
              <li>
                <a [href]="'/#' + item.section"
                   [attr.aria-current]="activeSection() === item.section ? 'location' : null"
                   class="block min-h-11 w-full px-2 py-3 hover:bg-neutral-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-selected-text"
                   [class.text-selected-text]="activeSection() === item.section"
                   (click)="navigateTo($event, item.section)">
                  {{ item.label | translate }}
                </a>
              </li>
            }
          </ul>
        </nav>
      }
    </div>
  </div>
</header>

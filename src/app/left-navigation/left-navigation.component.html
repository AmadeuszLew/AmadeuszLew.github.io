<nav class="fixed hidden md:block left-0 top-1/2 -translate-y-1/2 w-16 z-40" [attr.aria-label]="'SECTION_NAVIGATION' | translate">
  <ul class="flex flex-col items-center space-y-6">
    @for (dot of dots; track dot.section) {
      <li>
        <a [href]="'/#' + dot.section"
           [attr.aria-current]="activeSection() === dot.section ? 'location' : null"
           class="nav-dot relative flex w-7 h-7 items-center rounded-full border-4 border-nav focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-selected-text"
           [class.bg-blue-500]="activeSection() === dot.section"
           (click)="navigateTo($event, dot.section)">
          <span class="pointer-events-none absolute left-10 rounded-md bg-black px-2 py-1 opacity-0 whitespace-nowrap">
            {{ dot.label | translate }}
          </span>
        </a>
      </li>
    }
  </ul>
</nav>

@if (status() === 'loading') {
  <div class="absolute inset-0 animate-pulse bg-badge/40 motion-reduce:animate-none" aria-hidden="true"></div>
}

@if (status() === 'error') {
  <div class="absolute inset-0 flex flex-col items-center justify-center gap-2 p-4 text-center text-sm text-secondary">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="2" x2="22" y1="2" y2="22" />
      <path d="M10.41 10.41a2 2 0 1 1-2.83-2.83" />
      <line x1="13.5" x2="6" y1="13.5" y2="21" />
      <line x1="18" x2="21" y1="12" y2="15" />
      <path d="M3.59 3.59A1.99 1.99 0 0 0 3 5v14a2 2 0 0 0 2 2h14c.55 0 1.052-.22 1.41-.59" />
      <path d="M21 15V5a2 2 0 0 0-2-2H9" />
    </svg>
    <span>{{ 'IMAGE_LOAD_ERROR' | translate }}</span>
  </div>
} @else {
  <img #img
       [src]="image().thumb"
       [alt]="alt()"
       [width]="image().width"
       [height]="image().height"
       [attr.loading]="priority() ? 'eager' : 'lazy'"
       [attr.fetchpriority]="priority() ? 'high' : 'auto'"
       decoding="async"
       class="absolute inset-0 h-full w-full object-contain p-2"
       (load)="settle(img.getAttribute('src'), 'loaded')"
       (error)="settle(img.getAttribute('src'), 'error')" />
}
